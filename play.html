<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Night Watch — Buzzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;600&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sea:#060D18; --panel:#0D1826; --panel2:#0A1420; --line:#1E3049;
    --paper:#EDE6D6; --dim:#8FA3BC; --port:#FF4757; --stbd:#2EE38A; --mark:#FFC845;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:radial-gradient(600px 300px at 50% -5%, #0E2138 0%, transparent 60%), var(--sea);
    color:var(--paper); font-family:"Archivo",system-ui,sans-serif;
    display:flex; flex-direction:column; min-height:100dvh; height:100dvh; overflow:hidden;
    user-select:none; -webkit-user-select:none;
  }
  .mono{font-family:"IBM Plex Mono",monospace}
  header{display:flex; justify-content:space-between; align-items:center; padding:12px 18px; border-bottom:1px solid var(--line)}
  header .t{font-family:"Bricolage Grotesque"; font-weight:800; font-size:16px}
  header .sc{font-family:"IBM Plex Mono"; color:var(--mark); font-size:15px}
  section{
    flex:1; min-height:0; display:none; flex-direction:column; align-items:center;
    justify-content:center; padding:16px; gap:14px; text-align:center;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  section > :first-child{margin-top:auto}
  section > :last-child{margin-bottom:auto; padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  section.active{display:flex}
  h2{font-family:"Bricolage Grotesque"; font-weight:800; font-size:24px}
  .sub{color:var(--dim); font-size:14px; max-width:300px}

  input[type=text]{
    width:100%; max-width:300px; font-size:18px; padding:14px; border-radius:12px;
    border:1px solid var(--line); background:var(--panel); color:var(--paper);
    text-align:center; font-family:"Archivo"; outline:none;
  }
  input[type=text]:focus{border-color:var(--mark)}
  .horns{display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; max-width:320px}
  .horn{
    border:1px solid var(--line); background:var(--panel); color:var(--paper);
    border-radius:14px; padding:14px 8px; font-family:"Archivo"; font-weight:600; font-size:14px;
    display:flex; flex-direction:column; gap:6px; align-items:center; cursor:pointer;
  }
  .horn .ic{font-size:26px}
  .horn.sel{border-color:var(--mark); background:rgba(255,200,69,.10); box-shadow:0 0 18px rgba(255,200,69,.12)}
  .horn .tap{font-family:"IBM Plex Mono"; font-size:10px; color:var(--dim)}
  .btn{
    font-family:"Bricolage Grotesque"; font-weight:700; font-size:18px; color:var(--sea);
    background:var(--mark); border:none; border-radius:12px; padding:14px 34px; cursor:pointer;
  }
  .btn:disabled{opacity:.35}

  /* buzzer */
  #buzzWrap{position:relative; width:min(72vw,320px); aspect-ratio:1}
  #buzzBtn{
    position:absolute; inset:0; border-radius:50%; border:none; cursor:pointer;
    font-family:"Bricolage Grotesque"; font-weight:800; font-size:30px; letter-spacing:.05em;
    color:#2A0508; background:radial-gradient(circle at 35% 30%, #FF7A85, var(--port) 60%, #B41E2B);
    box-shadow:0 0 60px rgba(255,71,87,.45), 0 10px 0 #7E1620, inset 0 -8px 20px rgba(0,0,0,.35);
    transition:transform .08s, box-shadow .2s, filter .3s;
    touch-action:manipulation;
  }
  #buzzBtn:active{transform:translateY(8px); box-shadow:0 0 70px rgba(255,71,87,.6), 0 2px 0 #7E1620}
  #buzzBtn:disabled{filter:grayscale(.85) brightness(.55); box-shadow:0 6px 0 #222; cursor:default}
  .ring{position:absolute; inset:-12px; border-radius:50%; border:2px dashed var(--line); animation:spin 24s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #buzzState{font-size:16px; min-height:44px; color:var(--dim); max-width:320px}
  #buzzState b{color:var(--paper)}
  .hornnote{font-family:"IBM Plex Mono"; font-size:12px; color:var(--dim)}

  /* answers */
  .ansbtns{display:flex; flex-direction:column; gap:12px; width:100%; max-width:360px}
  .ans{
    display:flex; gap:12px; align-items:center; text-align:left;
    border:1px solid var(--line); background:var(--panel); color:var(--paper);
    border-radius:14px; padding:16px; font-size:16px; font-weight:600; font-family:"Archivo"; cursor:pointer;
  }
  .ans .key{
    font-family:"IBM Plex Mono"; color:var(--mark); border:1px solid var(--line); border-radius:8px;
    width:34px; height:34px; display:flex; align-items:center; justify-content:center; flex:none;
  }
  .ans:active{border-color:var(--mark)}
  #ansTimer{font-family:"IBM Plex Mono"; font-size:20px; color:var(--mark)}

  /* all-play shape grid */
  .kgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; max-width:400px}
  .kbtn{
    border:none; border-radius:14px; padding:12px 8px; cursor:pointer; color:#fff;
    display:flex; flex-direction:column; gap:8px; align-items:center; justify-content:center;
    font-family:"Archivo"; font-weight:700; min-height:82px;
    box-shadow:inset 0 -5px 0 rgba(0,0,0,.28);
  }
  .kbtn .shp{font-size:26px; line-height:1}
  .kbtn .txt{font-size:15px; line-height:1.3; font-weight:600}
  .kbtn:active{transform:translateY(3px); box-shadow:inset 0 -2px 0 rgba(0,0,0,.28)}
  .kbtn.pick{outline:3px solid #fff}
  .kbtn:disabled{opacity:.35}
  .streak{font-family:"IBM Plex Mono"; font-size:15px; color:var(--mark)}
  .pgfx{width:100%; max-width:430px}
  .pgfx:empty{display:none}
  .pgfx svg{width:100%; height:auto; max-height:21vh; border-radius:12px; border:1px solid var(--line)}
  .pgfx img{max-width:100%; max-height:21vh; border-radius:12px; border:1px solid var(--line); display:block; margin:0 auto}
  .pgfx .cap{font-family:"IBM Plex Mono"; font-size:11px; color:var(--dim); margin-top:4px; text-align:center}
  .gfx-cap{font-family:"IBM Plex Mono"; font-size:13px; letter-spacing:.2em; fill:#4E637E}
  .gfx-cap.day{fill:#2A4E6E}
  .popts{width:100%; max-width:430px; text-align:left; font-size:15px; line-height:1.6; color:var(--paper)}
  .popts b{font-family:"IBM Plex Mono"; color:var(--mark); margin-right:6px}
  body.bigtext .popts{font-size:20px}
  .fiftybtn{
    font-family:"IBM Plex Mono"; font-weight:600; font-size:12px; color:var(--mark);
    background:transparent; border:1.5px dashed var(--mark); border-radius:10px;
    padding:7px 12px; cursor:pointer; margin:0;
  }
  .fiftybtn:disabled{opacity:.35; border-style:solid; cursor:default}
  .kbtn.cut, .ans.cut{opacity:.18; filter:grayscale(1)}
  body.bigtext .fiftybtn{font-size:18px; padding:12px 16px}
  .qphone{
    font-family:"Bricolage Grotesque"; font-weight:700; font-size:17px; line-height:1.3;
    max-width:400px; color:var(--paper);
  }
  #fontBtn{
    font-family:"IBM Plex Mono"; font-weight:600; font-size:14px; color:var(--paper);
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:6px 10px; cursor:pointer;
  }
  body.bigtext #fontBtn{border-color:var(--mark); color:var(--mark)}
  body.bigtext .qphone{font-size:23px}
  body.bigtext .kbtn .txt{font-size:21px}
  body.bigtext .kbtn .shp{font-size:40px}
  body.bigtext .kbtn{min-height:104px}
  body.bigtext .ans{font-size:21px}
  body.bigtext h2{font-size:30px}
  body.bigtext .sub{font-size:18px}
  body.bigtext #buzzState{font-size:20px}
  body.bigtext #kTimer, body.bigtext #ansTimer{font-size:26px!important}
  body.bigtext .resD{font-size:32px}

  .big{font-size:56px}
  .resD{font-family:"IBM Plex Mono"; font-size:26px}
  .resD.up{color:var(--stbd)} .resD.dn{color:var(--port)}
  .flash-good{animation:fgood .8s} .flash-bad{animation:fbad .8s}
  @keyframes fgood{0%{background:rgba(46,227,138,.35)}100%{background:transparent}}
  @keyframes fbad{0%{background:rgba(255,71,87,.35)}100%{background:transparent}}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
</style>
</head>
<body>

<header>
  <div class="t" id="whoami">NIGHT&#9679;WATCH</div>
  <div style="display:flex;gap:10px;align-items:center">
    <button id="fontBtn" title="Bigger text">Aa</button>
    <div class="sc mono" id="myScore"></div>
  </div>
</header>

<!-- JOIN -->
<section id="sJoin" class="active">
  <h2>Come aboard</h2>
  <p class="sub">Name yourself, pick your horn (tap twice to hear it), and join the watch.</p>
  <input type="text" id="nameIn" maxlength="14" placeholder="Crew name" autocomplete="off">
  <div class="horns" id="hornGrid"></div>
  <button class="btn" id="joinBtn">Join the crew</button>
  <p class="sub mono" id="joinErr" style="color:var(--port)"></p>
</section>

<!-- WAIT -->
<section id="sWait">
  <div class="big">&#9873;</div>
  <h2 id="waitTitle">Aboard!</h2>
  <p class="sub" id="waitMsg">Waiting for the skipper to start… keep this screen open.</p>
</section>

<!-- BUZZER -->
<section id="sBuzz">
  <div class="qphone" id="bQ"></div>
  <div class="pgfx" id="bGfx"></div>
  <div class="popts" id="bOpts"></div>
  <div id="buzzWrap">
    <div class="ring"></div>
    <button id="buzzBtn">BUZZ</button>
  </div>
  <div id="buzzState">Read the question on the big screen…</div>
  <div class="hornnote" id="hornNote"></div>
</section>

<!-- ANSWER -->
<section id="sAns">
  <h2>You're on the helm!</h2>
  <div class="qphone" id="aQ"></div>
  <div class="pgfx" id="aGfx"></div>
  <div id="ansTimer"></div>
  <button class="fiftybtn" id="fiftyA">&#9986;&#65039; 50:50 &#183; knock out two wrong answers</button>
  <div class="ansbtns" id="ansBtns"></div>
</section>

<!-- ALL-PLAY -->
<section id="sK">
  <h2 id="kTitle">Lock in your answer</h2>
  <div class="qphone" id="kQ"></div>
  <div class="pgfx" id="kGfx"></div>
  <div id="kTimer" class="mono" style="font-size:18px;color:var(--mark)"></div>
  <button class="fiftybtn" id="fiftyK">&#9986;&#65039; 50:50 &#183; knock out two wrong answers</button>
  <div class="kgrid" id="kGrid"></div>
  <p class="sub" id="kState"></p>
</section>

<!-- RESULT -->
<section id="sRes">
  <div class="big" id="resIcon"></div>
  <h2 id="resTitle"></h2>
  <div class="resD" id="resDelta"></div>
  <div class="streak" id="resStreak"></div>
  <p class="sub" id="resMsg"></p>
</section>

<!-- END -->
<section id="sEnd">
  <div class="big" id="endIcon"></div>
  <h2 id="endTitle"></h2>
  <p class="sub" id="endMsg"></p>
</section>

<script src="mqtt.min.js"></script>
<script src="audio.js"></script>
<script src="gfx.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const code = (qs.get("g") || "").toUpperCase();
const brokerIdx = parseInt(qs.get("b") || "0", 10) || 0;
const BROKERS = ["wss://broker.emqx.io:8084/mqtt", "wss://broker.hivemq.com:8884/mqtt"];
const pid = "p_" + Math.random().toString(36).slice(2, 10);
let client = null, joined = false, helloTimer = null;
let mySound = "fog", myName = "", myScore = 0, armed = false;

function sendHost(m) {
  try { if (client) client.publish("nightwatch1/" + code + "/h", JSON.stringify(Object.assign({ from: pid }, m))); } catch (e) {}
}

function connect() {
  if (typeof mqtt === "undefined") { $("joinBtn").disabled = false; $("joinErr").textContent = "Couldn't load the connection library — refresh and try again."; return; }
  const url = BROKERS[brokerIdx] || BROKERS[0];
  client = mqtt.connect(url, {
    clientId: "nwqp_" + pid,
    keepalive: 15, clean: true, connectTimeout: 8000, reconnectPeriod: 2000,
    will: { topic: "nightwatch1/" + code + "/h", payload: JSON.stringify({ from: pid, t: "bye" }), qos: 0, retain: false }
  });
  client.on("connect", () => {
    client.subscribe("nightwatch1/" + code + "/p/" + pid);
    sendHost({ t: "join", name: myName, sound: mySound });   // also re-announces after any reconnect
    startJoinKnock();
  });
  client.on("message", (t, payload) => { try { onMsg(JSON.parse(payload.toString())); } catch (e) {} });
  client.on("error", () => {
    if (!joined) { $("joinBtn").disabled = false; $("joinErr").textContent = "Can't reach the signal server — check your phone's internet."; }
  });
  client.on("offline", () => {
    if (joined) { $("waitTitle").textContent = "Signal lost"; $("waitMsg").textContent = "Reconnecting… hold tight, your score is kept."; show("sWait"); }
  });
}

/* Keep knocking until the host answers — hosts on phones nap when backgrounded */
let knockTimer = null, knocks = 0;
function startJoinKnock() {
  if (joined) return;
  clearInterval(knockTimer); knocks = 0;
  knockTimer = setInterval(() => {
    if (joined) { clearInterval(knockTimer); return; }
    knocks++;
    sendHost({ t: "join", name: myName, sound: mySound });
    if (knocks === 3) $("joinErr").textContent = "Knocking on the host's door… if their screen is locked or they're in another app, ask them to open the quiz.";
    if (knocks >= 25) {
      clearInterval(knockTimer);
      $("joinBtn").disabled = false;
      $("joinErr").textContent = "No reply from the host after a good knock. Check they're on the lobby screen, then try again.";
    }
  }, 3000);
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && myName && client) {
    if (!client.connected && client.reconnect) try { client.reconnect(); } catch (e) {}
    sendHost({ t: "join", name: myName, sound: mySound });   // harmless re-announce, restores host registry
  }
});

function show(id) { document.querySelectorAll("section").forEach(s => s.classList.remove("active")); $(id).classList.add("active"); }
function setScore(s) { myScore = s; $("myScore").textContent = "PTS " + s; }
function vibrate(p) { if (navigator.vibrate) try { navigator.vibrate(p); } catch (e) {} }

/* question media (SVG graphics or Wikipedia photos) on the phone */
function showMedia(el, m) {
  el.innerHTML = "";
  if (m.photo) {
    el.innerHTML = '<img alt="question photo"><div class="cap">hoisting the photo\u2026</div>';
    loadWikiPhoto(m.photo, el.querySelector("img"), el.querySelector(".cap"));
  } else if (m.gfx) {
    el.innerHTML = renderGfx(m.gfx);
  }
}

/* 50:50 lifeline — once per game, validated by the host */
let usedFifty = false;
function fiftyLabel() {
  const label = usedFifty ? "&#9986;&#65039; 50:50 &#183; used this game" : "&#9986;&#65039; 50:50 &#183; knock out two wrong answers";
  ["fiftyK", "fiftyA"].forEach(id => { $(id).innerHTML = label; $(id).disabled = usedFifty; });
}
function requestFifty() { if (usedFifty) return; sendHost({ t: "fifty" }); }
$("fiftyK").onclick = requestFifty;
$("fiftyA").onclick = requestFifty;

/* big-text toggle (for crew with tired eyes) */
try { if (localStorage.getItem("nwq_big") === "1") document.body.classList.add("bigtext"); } catch (e) {}
$("fontBtn").onclick = () => {
  const on = document.body.classList.toggle("bigtext");
  try { localStorage.setItem("nwq_big", on ? "1" : "0"); } catch (e) {}
};

/* horn picker */
const grid = $("hornGrid");
Object.entries(HORNS).forEach(([k, h], i) => {
  const b = document.createElement("button");
  b.className = "horn" + (i === 0 ? " sel" : "");
  b.innerHTML = '<span class="ic">' + h.icon + "</span>" + h.label + '<span class="tap">TAP AGAIN TO HEAR</span>';
  b.onclick = () => {
    unlockAudio();
    if (mySound === k) playHorn(k);
    mySound = k;
    document.querySelectorAll(".horn").forEach(x => x.classList.remove("sel"));
    b.classList.add("sel");
  };
  grid.appendChild(b);
});

/* join */
$("joinBtn").onclick = () => {
  unlockAudio();
  myName = $("nameIn").value.trim();
  if (!myName) { $("joinErr").textContent = "Give yourself a name first, sailor."; return; }
  if (!code) { $("joinErr").textContent = "No boarding code — scan the QR on the big screen."; return; }
  $("joinBtn").disabled = true; $("joinErr").textContent = "Hailing the mothership…";
  connect();
};

function onMsg(m) {
  if (m.t === "marco") {
    if (myName && !joined) { sendHost({ t: "join", name: myName, sound: mySound }); }
    return;
  }

  if (m.t === "hello") {
    const firstHello = !joined;
    joined = true; clearTimeout(helloTimer); clearInterval(knockTimer);
    $("joinErr").textContent = "";
    mySound = m.sound; setScore(m.score);
    $("whoami").textContent = HORNS[mySound].icon + " " + myName.toUpperCase();
    $("hornNote").textContent = "YOUR HORN: " + m.horn.toUpperCase();
    if (firstHello) playHorn(mySound);
  }
  if (m.t === "phase" && m.p === "lobby") { $("waitTitle").textContent = "Aboard!"; $("waitMsg").textContent = "Waiting for the skipper to start… keep this screen open."; show("sWait"); }
  if (m.t === "wait") { $("waitTitle").textContent = "Hold fast"; $("waitMsg").textContent = "A question is in play — you'll get the next one."; show("sWait"); }

  if (m.t === "arm") {
    if (m.qnum === 1) { usedFifty = false; }
    armed = !m.locked;
    $("buzzBtn").disabled = !!m.locked;
    if (m.q) {
      $("bQ").textContent = (m.qnum ? "Q" + m.qnum + (m.lvl ? " \u00B7 " + m.lvl : "") + " \u2014 " : "") + m.q;
      showMedia($("bGfx"), m);
      $("bOpts").innerHTML = (m.opts || []).map((o, i) => "<div><b>" + "ABCD"[i] + "</b>" + o.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])) + "</div>").join("");
    } else { $("bQ").textContent = ""; $("bGfx").innerHTML = ""; $("bOpts").innerHTML = ""; }
    $("buzzState").innerHTML = m.locked
      ? "You're <b>locked out</b> of this question — wrong answer. Next one's yours."
      : "Buzzers <b>ARMED</b> — know it? HIT IT!";
    show("sBuzz");
    if (!m.locked) vibrate(60);
  }

  if (m.t === "q") {   /* all-play: everyone answers */
    vibrate(60); unlockAudio();
    if (m.qnum === 1) usedFifty = false;
    fiftyLabel();
    const SH = [
      { g: "▲", c: "#E5484D" }, { g: "◆", c: "#1E6FD9" },
      { g: "●", c: "#E8930C" }, { g: "■", c: "#2EBB6E" }
    ];
    $("kTitle").textContent = "Q" + m.qnum + (m.lvl ? " · " + m.lvl : "");
    $("kQ").textContent = m.q || "";
    showMedia($("kGfx"), m);
    $("kState").textContent = "Faster answers score more — streaks pay bonus.";
    $("kGrid").innerHTML = "";
    let picked = false;
    m.opts.forEach((o, i) => {
      const b = document.createElement("button");
      b.className = "kbtn"; b.style.background = SH[i].c;
      b.innerHTML = '<span class="shp">' + SH[i].g + '</span><span class="txt">' + o.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])) + "</span>";
      b.onclick = () => {
        if (picked) return; picked = true;
        sendHost({ t: "ans", i });
        playHorn(mySound); vibrate(70);
        document.querySelectorAll(".kbtn").forEach((x, k) => { x.disabled = true; if (k === i) x.classList.add("pick"); });
        $("fiftyK").disabled = true;
        $("kState").textContent = "Locked in — waiting for the rest of the crew…";
      };
      $("kGrid").appendChild(b);
    });
    let s = m.secs; $("kTimer").textContent = s + "s";
    const iv = setInterval(() => {
      s--;
      if (s <= 0 || !$("sK").classList.contains("active")) { clearInterval(iv); $("kTimer").textContent = ""; }
      else $("kTimer").textContent = s + "s";
    }, 1000);
    show("sK");
  }

  if (m.t === "won") {
    vibrate([80, 40, 80]);
    playHorn(mySound);
    $("aQ").textContent = m.q || "";
    showMedia($("aGfx"), m);
    fiftyLabel();
    $("ansBtns").innerHTML = "";
    m.opts.forEach((o, i) => {
      const b = document.createElement("button");
      b.className = "ans";
      b.innerHTML = '<span class="key">' + "ABCD"[i] + "</span><span>" + o.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])) + "</span>";
      b.onclick = () => { sendHost({ t: "ans", i }); $("ansTimer").textContent = ""; };
      $("ansBtns").appendChild(b);
    });
    let s = m.secs; $("ansTimer").textContent = s + "s";
    const iv = setInterval(() => { s--; if (s <= 0 || !$("sAns").classList.contains("active")) { clearInterval(iv); $("ansTimer").textContent = ""; } else $("ansTimer").textContent = s + "s"; }, 1000);
    show("sAns");
  }

  if (m.t === "fifty") {
    if (m.used) { usedFifty = true; fiftyLabel(); return; }
    if (!m.drop || !m.drop.length) return;
    usedFifty = true; fiftyLabel();
    vibrate([40, 30, 40]);
    m.drop.forEach(i => {
      const k = $("kGrid").children[i]; if (k) { k.disabled = true; k.classList.add("cut"); }
      const a = $("ansBtns").children[i]; if (a) { a.disabled = true; a.classList.add("cut"); }
    });
  }

  if (m.t === "lost") {
    armed = false; $("buzzBtn").disabled = true;
    $("buzzState").innerHTML = "&#9888;&#65039; <b>" + m.name + "</b> beat you to it…";
    show("sBuzz");
  }

  if (m.t === "lockout") {
    $("buzzBtn").disabled = true;
    $("buzzState").innerHTML = "You're <b>locked out</b> of this question. Next one's yours.";
    show("sBuzz");
  }

  if (m.t === "judge") {
    setScore(m.score);
    document.body.classList.remove("flash-good", "flash-bad");
    void document.body.offsetWidth;
    document.body.classList.add(m.ok ? "flash-good" : "flash-bad");
    $("resIcon").textContent = m.ok ? "⚓" : (m.noans ? "⏱️" : "🌊");
    $("resTitle").textContent = m.ok ? "Correct — well helmed!" : (m.noans ? "Too slow — no answer in" : "Wrong — into the drink!");
    $("resDelta").textContent = m.delta ? ((m.delta > 0 ? "+" : "") + m.delta + " pts") : "+0 pts";
    $("resDelta").className = "resD " + (m.ok ? "up" : "dn");
    $("resStreak").textContent = m.ok && m.streak >= 2 ? "🔥 " + m.streak + " in a row — streak bonus paid" : "";
    $("resMsg").textContent = m.ok
      ? "Eyes on the big screen for the next question."
      : (m.correctText !== undefined
          ? "It was: " + m.correctText
          : "You're locked out of this one — the rest of the crew can steal it.");
    if (m.ok) playHorn("bell"); vibrate(m.ok ? 120 : [60, 60, 60]);
    show("sRes");
  }

  if (m.t === "reveal") {
    if (!$("sRes").classList.contains("active")) {
      $("resIcon").textContent = "🧭";
      $("resTitle").textContent = "Answer: " + m.a;
      $("resDelta").textContent = ""; $("resDelta").className = "resD";
      $("resMsg").textContent = m.text + " — next question coming up on the big screen.";
      show("sRes");
    }
  }

  if (m.t === "end") {
    const medal = ["🥇", "🥈", "🥉"][m.place - 1] || "⚓";
    $("endIcon").textContent = medal;
    $("endTitle").textContent = m.place === 1 ? "You have the helm!" : "Placed " + m.place + " of " + m.of;
    $("endMsg").textContent = "Final score: " + m.score + " pts. " + (m.place === 1 ? "First round at the bar is on the losers." : "There's always the next tide.");
    setScore(m.score);
    if (m.place === 1) playHorn(mySound);
    show("sEnd");
  }
}

/* the buzzer itself */
$("buzzBtn").addEventListener("pointerdown", () => {
  if (!armed || $("buzzBtn").disabled) return;
  armed = false;
  unlockAudio(); playHorn(mySound); vibrate(90);
  sendHost({ t: "buzz" });
  $("buzzState").innerHTML = "&#128226; Horn sounded — waiting on the skipper's screen…";
});
</script>
</body>
</html>
